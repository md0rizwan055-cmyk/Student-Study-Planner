<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode — StudyAI</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .focus-container { max-width: 520px; width: 100%; text-align: center; padding: var(--space-6); }
    .timer-ring { position: relative; width: 280px; height: 280px; margin: 0 auto var(--space-8); }
    .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: var(--border); stroke-width: 8; }
    .timer-progress { fill: none; stroke: url(#timerGrad); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 754; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
    .timer-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .timer-time { font-family: 'JetBrains Mono', monospace; font-size: var(--text-5xl); font-weight: 700; color: var(--text-primary); line-height: 1; animation: timerPulse 2s ease-in-out infinite; }
    .timer-label { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-1); }
    .subject-tag { background: var(--primary-bg); border: 1px solid rgba(0, 245, 160, 0.3); border-radius: var(--radius-full); padding: var(--space-2) var(--space-5); display: inline-flex; align-items: center; gap: var(--space-2); font-weight: var(--font-semibold); margin-bottom: var(--space-4); box-shadow: 0 0 15px rgba(0, 245, 160, 0.15); }
    .controls { display: flex; gap: var(--space-4); justify-content: center; margin-top: var(--space-6); }
    .control-btn { width: 64px; height: 64px; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: all var(--transition-spring); }
    .control-btn:hover { transform: scale(1.1); }
    .control-btn:active { transform: scale(0.95); }
    .feedback-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-2xl); padding: var(--space-6); margin-top: var(--space-6); display: none; }
    .feedback-options { display: flex; gap: var(--space-3); justify-content: center; margin-top: var(--space-4); }
    .feedback-btn { padding: var(--space-3) var(--space-5); border-radius: var(--radius-xl); border: 1px solid var(--border); cursor: pointer; font-size: var(--text-sm); font-weight: var(--font-medium); background: var(--bg-card); color: var(--text-secondary); transition: all var(--transition-fast); }
    .feedback-btn:hover, .feedback-btn.selected { border-color: var(--primary); background: var(--primary-bg); color: var(--primary-light); }
    .setup-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-2xl); padding: var(--space-8); }
  </style>
</head>
<body>
<a href="../dashboard/index.html" style="position:fixed;top:var(--space-5);left:var(--space-5);z-index:10" class="btn btn-secondary btn-sm" aria-label="Back to dashboard">← Dashboard</a>
<div style="position:fixed;top:var(--space-5);right:var(--space-5);z-index:10;display:flex;gap:var(--space-2)" role="group" aria-label="Theme selection">
  <button class="btn btn-icon" data-theme-btn="light" aria-label="Light mode">☀️</button>
  <button class="btn btn-icon" data-theme-btn="dark" aria-label="Dark mode">🌙</button>
</div>

<main class="focus-container" role="main" aria-label="Focus Mode">
  <!-- Setup -->
  <div id="setup-panel" class="setup-panel animate-fade-up">
    <h1 style="font-size:var(--text-2xl);font-weight:800;margin-bottom:var(--space-2)">⏱️ Focus Mode</h1>
    <p class="text-secondary text-sm mb-6">Choose a session or start a free study timer</p>
    <div class="form-group mb-4">
      <label class="form-label" for="session-select">Select Today's Session</label>
      <select id="session-select" class="form-input form-select" aria-label="Select study session">
        <option value="">— Loading sessions... —</option>
      </select>
    </div>
    <div class="form-group mb-6">
      <label class="form-label" for="duration-select">Duration</label>
      <select id="duration-select" class="form-input form-select" aria-label="Session duration">
        <option value="25">25 minutes (Pomodoro)</option>
        <option value="45" selected>45 minutes</option>
        <option value="60">60 minutes</option>
        <option value="90">90 minutes</option>
        <option value="120">2 hours</option>
      </select>
    </div>
    <button class="btn btn-primary btn-lg w-full" id="start-focus-btn" aria-label="Start focus session">▶ Start Focused Session</button>
  </div>

  <!-- Timer -->
  <div id="timer-panel" class="hidden animate-scale-bounce">
    <div id="subject-tag" class="subject-tag" role="status" aria-live="polite">
      <span id="focus-subject-color" style="width:10px;height:10px;border-radius:50%;background:var(--primary)" aria-hidden="true"></span>
      <span id="focus-topic">Study Session</span>
    </div>
    <div class="text-xs text-muted mb-2" id="focus-type">📖 Learning Session</div>

    <div class="timer-ring" role="timer" aria-label="Study timer" aria-live="off">
      <svg class="timer-svg" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00f5a0"/>
            <stop offset="100%" style="stop-color:#ffb800"/>
          </linearGradient>
        </defs>
        <circle class="timer-bg" cx="120" cy="120" r="108"/>
        <circle class="timer-progress" id="timer-ring-el" cx="120" cy="120" r="108"/>
      </svg>
      <div class="timer-display">
        <div class="timer-time" id="timer-display" aria-label="Time remaining">45:00</div>
        <div class="timer-label" id="timer-state-label">Focus</div>
      </div>
    </div>

    <div class="controls" role="group" aria-label="Timer controls">
      <button class="control-btn" id="pause-btn"
        style="background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary)"
        aria-label="Pause timer">⏸</button>
      <button class="control-btn" id="complete-btn"
        style="background:linear-gradient(135deg,var(--emerald-500),var(--cyan-500));color:#fff"
        aria-label="Complete session">✓</button>
      <button class="control-btn" id="abandon-btn"
        style="background:var(--danger-bg);border:1px solid rgba(244,63,94,0.3);color:var(--danger)"
        aria-label="Abandon session">✕</button>
    </div>

    <div class="mt-4 text-sm text-muted" id="session-progress-text" role="status" aria-live="polite"></div>
  </div>

  <!-- Feedback -->
  <div id="feedback-panel" class="hidden animate-fade-up">
    <div style="font-size:3rem;margin-bottom:var(--space-4)">🎉</div>
    <h2 style="font-size:var(--text-2xl);font-weight:800;margin-bottom:var(--space-2)">Session Complete!</h2>
    <p class="text-secondary text-sm mb-6">How did it go? Your feedback helps the AI improve your future schedule.</p>
    <div class="feedback-options" role="group" aria-label="Session feedback">
      <button class="feedback-btn" data-rating="easy" aria-label="Session was easy">😌 Easy</button>
      <button class="feedback-btn" data-rating="neutral" aria-label="Session was neutral">😊 Neutral</button>
      <button class="feedback-btn" data-rating="hard" aria-label="Session was hard">😓 Hard</button>
    </div>
    <div class="form-group mt-4">
      <textarea id="feedback-notes" class="form-input" rows="2" placeholder="Optional notes..." style="resize:vertical" aria-label="Session notes"></textarea>
    </div>
    <button class="btn btn-primary w-full mt-4" id="submit-feedback-btn" aria-label="Submit feedback">Submit & Continue</button>
    <button class="btn btn-ghost w-full mt-2" id="skip-feedback-btn" aria-label="Skip feedback">Skip</button>
  </div>
</main>

<div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
<script type="module" src="../js/focus.js"></script>
</body>
</html>
