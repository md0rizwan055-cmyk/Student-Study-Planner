<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — StudyAI</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .calendar-layout { display: grid; grid-template-columns: 1fr 300px; gap: var(--space-6); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: var(--space-2); }
    .cal-dow { font-size: var(--text-xs); font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: var(--space-2); }
    .cal-cell { background: var(--glass-bg); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); min-height: 100px; padding: var(--space-2); cursor: pointer; transition: all var(--transition-fast); }
    .cal-cell:hover { border-color: var(--primary); background: var(--primary-bg); }
    .cal-cell.today { border-color: var(--primary); background: rgba(0, 245, 160, 0.08); box-shadow: 0 0 15px rgba(0, 245, 160, 0.15); }
    .cal-cell.other-month { opacity: 0.4; }
    .cal-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .cal-day-num { font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); margin-bottom: 2px; }
    .cal-cell.today .cal-day-num { color: var(--primary-light); font-weight: 800; }
    .cal-event { font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 600; }
    .selected-day-panel { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: var(--radius-2xl); padding: var(--space-5); position: sticky; top: 80px; }
    @media (max-width: 900px) { .calendar-layout { grid-template-columns: 1fr; } .cal-cell { min-height: 60px; } }
  </style>
</head>
<body>
<nav class="nav" role="navigation"><button id="sidebar-toggle" class="btn btn-icon" aria-label="Toggle sidebar">☰</button><a href="../dashboard/index.html" class="nav-logo"><div class="nav-logo-icon">🎓</div><span class="nav-logo-text">StudyAI</span></a></nav>
<aside class="sidebar" role="navigation"><div class="sidebar-section">Main</div><a href="../dashboard/index.html" class="sidebar-item"><span>🏠</span> Dashboard</a><a href="../planner/index.html" class="sidebar-item"><span>📅</span> Planner</a><a href="index.html" class="sidebar-item active" aria-current="page"><span>🗓️</span> Calendar</a><a href="../focus/index.html" class="sidebar-item"><span>⏱️</span> Focus Mode</a><div class="sidebar-section">Academic</div><a href="../subjects/index.html" class="sidebar-item"><span>📚</span> Subjects & Topics</a><a href="../progress/index.html" class="sidebar-item"><span>📊</span> Progress</a><div class="sidebar-section">AI</div><a href="../ai-chat/index.html" class="sidebar-item"><span>💬</span> AI Assistant</a><a href="../settings/index.html" class="sidebar-item"><span>⚙️</span> Settings</a><button class="sidebar-item" data-logout><span>🚪</span> Logout</button></aside>

<main class="page-with-sidebar" role="main">
  <div class="page-header">
    <div class="flex items-center justify-between">
      <div><h1 class="page-title">Calendar 🗓️</h1><p class="text-secondary text-sm mt-1">Visual overview of your study schedule</p></div>
      <div class="flex items-center gap-3">
        <button class="btn btn-secondary btn-sm" id="prev-month" aria-label="Previous month">← Prev</button>
        <h2 id="month-label" style="font-size:var(--text-lg);font-weight:700;color:var(--text-primary);min-width:160px;text-align:center"></h2>
        <button class="btn btn-secondary btn-sm" id="next-month" aria-label="Next month">Next →</button>
        <button class="btn btn-ghost btn-sm" id="today-btn" aria-label="Go to today">Today</button>
      </div>
    </div>
  </div>

  <div class="calendar-layout">
    <div>
      <!-- Legend -->
      <div class="flex gap-4 mb-4 flex-wrap" id="subject-legend" role="list" aria-label="Subject legend"></div>

      <!-- Calendar Grid -->
      <div class="cal-header" role="row">
        <div class="cal-dow" role="columnheader">Mon</div>
        <div class="cal-dow" role="columnheader">Tue</div>
        <div class="cal-dow" role="columnheader">Wed</div>
        <div class="cal-dow" role="columnheader">Thu</div>
        <div class="cal-dow" role="columnheader">Fri</div>
        <div class="cal-dow" role="columnheader">Sat</div>
        <div class="cal-dow" role="columnheader">Sun</div>
      </div>
      <div class="cal-grid" id="cal-grid" role="grid" aria-label="Monthly calendar"></div>
    </div>

    <!-- Selected day -->
    <div class="selected-day-panel" role="complementary" aria-label="Selected day sessions">
      <h3 class="font-semibold mb-4" id="selected-day-title" style="color:var(--text-primary)">Select a day</h3>
      <div id="selected-day-sessions" role="list" aria-live="polite">
        <div class="text-sm text-muted text-center py-8">Click on a day to see sessions</div>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
<script type="module" src="../js/calendar.js"></script>
</body>
</html>
